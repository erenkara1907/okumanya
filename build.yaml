targets:
  $default:
    builders:
      freezed:
        options:
          # Generate copyWith, toString, operator==, hashCode
          copyWith: true
          equal: true
          to_string_override: true
        generate_for:
          - lib/features/*/domain/entities/*.dart
          - lib/features/*/data/models/*.dart
          - lib/features/*/presentation/bloc/*.dart
          - lib/core/**/*.dart
      json_serializable:
        options:
          # Generate toJson and fromJson methods
          any_map: false
          checked: false
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          include_if_null: true
        generate_for:
          - lib/features/*/data/models/*.dart