name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Static Analysis & Tests
  analyze:
    runs-on: ubuntu-latest
    name: Static Analysis & Testing
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 🔍 Verify Dependencies
      run: flutter pub deps
      
    - name: 🧹 Check Formatting
      run: dart format --output=none --set-exit-if-changed .
      
    - name: 📈 Dart Analyze
      run: flutter analyze --fatal-infos --fatal-warnings
      
    - name: 🧪 Run Unit Tests
      run: flutter test --coverage --test-randomize-ordering-seed random
      
    - name: 📊 Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        name: codecov-umbrella
        fail_ci_if_error: false

  # Security Scan
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: analyze
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🔒 Run Security Scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'
        
    - name: 🔍 Dependency Scan
      run: |
        flutter pub deps --json > deps.json
        # Add dependency vulnerability scanning here

  # Android Build
  build-android:
    runs-on: ubuntu-latest
    name: Build Android
    needs: [analyze, security]
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 🔧 Code Generation
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: 🏗️ Build APK (Debug)
      run: flutter build apk --debug --split-per-abi
      
    - name: 🏗️ Build APK (Release)
      run: flutter build apk --release --split-per-abi
      
    - name: 🏗️ Build App Bundle
      run: flutter build appbundle --release
      
    - name: 📤 Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-builds
        path: |
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/bundle/release/*.aab
        retention-days: 30

  # iOS Build (macOS runner required)
  build-ios:
    runs-on: macos-latest
    name: Build iOS
    needs: [analyze, security]
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 🔧 Code Generation
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: 📱 Setup iOS
      run: |
        cd ios
        pod install --repo-update
        cd ..
        
    - name: 🏗️ Build iOS (Debug)
      run: flutter build ios --debug --no-codesign
      
    - name: 🏗️ Build iOS (Release)
      run: flutter build ios --release --no-codesign
      
    - name: 📤 Upload iOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-builds
        path: |
          build/ios/iphoneos/*.app
        retention-days: 30

  # Integration Tests
  integration-test:
    runs-on: macos-latest
    name: Integration Tests
    needs: [build-android, build-ios]
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 🔧 Code Generation
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: 🚀 Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        
    - name: 📱 AVD Cache
      uses: actions/cache@v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-29
        
    - name: 🤖 Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."
        
    - name: 🧪 Run Integration Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: flutter test integration_test

  # Performance Analysis
  performance:
    runs-on: ubuntu-latest
    name: Performance Analysis
    needs: analyze
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 🔧 Code Generation
      run: dart run build_runner build --delete-conflicting-outputs
      
    - name: 📊 Bundle Size Analysis
      run: |
        flutter build apk --release --analyze-size --target-platform android-arm64
        flutter build ios --release --analyze-size --no-codesign
        
    - name: 🚀 Performance Profiling
      run: |
        # Add performance profiling scripts here
        echo "Performance analysis completed"

  # Deployment (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Stores
    needs: [build-android, build-ios, integration-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 📥 Download Android Artifacts
      uses: actions/download-artifact@v4
      with:
        name: android-builds
        path: ./android-builds
        
    - name: 📥 Download iOS Artifacts
      uses: actions/download-artifact@v4
      with:
        name: ios-builds
        path: ./ios-builds
        
    - name: 🏪 Deploy to Internal Testing
      run: |
        echo "Deploying to internal testing tracks..."
        # Add actual deployment scripts here
        
    - name: 🔔 Notify Deployment
      run: |
        echo "Deployment completed successfully!"
        # Add notification logic here (Slack, Discord, etc.)

  # Documentation
  docs:
    runs-on: ubuntu-latest
    name: Update Documentation
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📚 Git Checkout
      uses: actions/checkout@v4
      
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.1'
        channel: 'stable'
        cache: true
        
    - name: 📦 Install Dependencies
      run: flutter pub get
      
    - name: 📖 Generate Documentation
      run: |
        dart doc --output=doc/api
        
    - name: 🌐 Deploy Documentation
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./doc/api